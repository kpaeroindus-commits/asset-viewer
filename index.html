<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>전산장비 정보</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      background: #f3f5f8;
      color: #111827;
      margin: 0;
      padding: 16px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .header {
      background: #1e293b;
      color: #fff;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .header .title { font-size: 13px; color: #cbd5e1; margin-bottom: 4px; }
    .header .asset-id { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; }
    .badge {
      background: #3b82f6;
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .section-title {
      background: #f8fafc;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      border-top: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 11px 20px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
      text-align: left;
      word-break: break-all;
    }
    th { width: 36%; color: #64748b; font-weight: 600; background: #fcfcfd; }
    td { color: #0f172a; font-weight: 500; }
    a.rel-link {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      padding: 2px 8px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      margin: 2px 4px 2px 0;
    }
    .footer {
      padding: 14px 20px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
      background: #f8fafc;
    }
    .msg {
      padding: 32px 22px;
      text-align: center;
    }
    .msg h2 { margin: 0 0 10px; font-size: 19px; color: #1f2937; }
    .msg p { color: #6b7280; font-size: 14px; line-height: 1.6; margin: 0; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 14px;
      border: 4px solid #e2e8f0; border-top-color: #3b82f6;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block; margin-top: 16px; padding: 9px 18px;
      background: #1e293b; color: #fff; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="app">
      <div class="msg"><div class="spinner"></div><p>장비 정보를 불러오는 중...</p></div>
    </div>
  </div>

  <script>
    /* ============================================================
     * Apps Script 웹앱 주소 (배포 관리에서 복사한 /exec 주소)
     * 배포를 "편집 → 새 버전"으로만 올리면 이 주소는 바뀌지 않습니다.
     * ============================================================ */
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzuCvN2MZGFwRFn81cf3TsM4x-o2nWQElpKShsTmnwJZgRcPv9H_jo5Ng6DWltbAMxJsg/exec';

    const app = document.getElementById('app');

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function selfLink(id) {
      return location.pathname + '?id=' + encodeURIComponent(id);
    }

    function showMessage(title, body, retry) {
      app.innerHTML =
        '<div class="msg"><h2>' + esc(title) + '</h2><p>' + body + '</p>' +
        (retry ? '<button class="btn" onclick="load()">다시 시도</button>' : '') +
        '</div>';
    }

    function linkify(text, relatedIds) {
      const map = {};
      (relatedIds || []).forEach(id => { map[String(id).toUpperCase()] = id; });
      return esc(text).replace(/\b((?:PC|MO|NB)-\d+|N\d+)\b/gi, m => {
        const real = map[m.toUpperCase()];
        return real
          ? '<a class="rel-link" href="' + esc(selfLink(real)) + '">' + esc(m) + '</a>'
          : m;
      });
    }

    function rowsHtml(rows, relatedIds) {
      return rows.map(r =>
        '<tr><th>' + esc(r.label) + '</th><td>' +
        (r.related && r.value !== '-' ? linkify(r.value, relatedIds) : esc(r.value)) +
        '</td></tr>'
      ).join('');
    }

    function render(d) {
      document.title = d.id + ' 전산장비 정보';
      app.innerHTML =
        '<div class="header"><div>' +
          '<div class="title">전산장비 식별 정보</div>' +
          '<div class="asset-id">' + esc(d.id) + '</div>' +
        '</div><div class="badge">' + esc(d.typeLabel) + '</div></div>' +
        '<div class="section-title">기본 정보</div>' +
        '<table>' + rowsHtml(d.common || [], d.relatedIds) + '</table>' +
        ((d.specs && d.specs.length)
          ? '<div class="section-title">장비 상세 사양</div><table>' + rowsHtml(d.specs, d.relatedIds) + '</table>'
          : '') +
        '<div class="footer">' + esc(d.notice || '') + '</div>';
    }

    async function load() {
      const id = (new URLSearchParams(location.search).get('id') || '').trim();
      if (!id) {
        showMessage('자산번호가 없습니다', '장비에 부착된 QR 코드를 다시 스캔해 주세요.');
        return;
      }

      app.innerHTML = '<div class="msg"><div class="spinner"></div><p>장비 정보를 불러오는 중...</p></div>';

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);

      try {
        // credentials: 'omit' → Google 로그인 쿠키를 보내지 않으므로 /u/3 문제가 생기지 않음
        const res = await fetch(GAS_URL + '?mode=json&id=' + encodeURIComponent(id), {
          method: 'GET',
          credentials: 'omit',
          redirect: 'follow',
          signal: ctrl.signal
        });
        const text = await res.text();
        let d;
        try {
          d = JSON.parse(text);
        } catch (e) {
          showMessage('서버 응답 오류',
            '데이터를 읽지 못했습니다.<br>Apps Script 배포의 액세스 권한이 "모든 사용자"인지,<br>최신 버전으로 배포되었는지 확인해 주세요.', true);
          return;
        }

        if (d.error) {
          showMessage('조회 중 오류가 발생했습니다', esc(d.error), true);
        } else if (!d.ok) {
          showMessage('장비 정보를 찾을 수 없습니다',
            '요청된 자산번호: <b>' + esc(id) + '</b><br>자산대장에 등록된 번호인지 확인해주세요.');
        } else {
          render(d);
        }
      } catch (e) {
        showMessage('연결에 실패했습니다',
          (e.name === 'AbortError' ? '응답 시간이 초과되었습니다.' : '네트워크 상태를 확인해 주세요.'), true);
      } finally {
        clearTimeout(timer);
      }
    }

    load();
  </script>
</body>
</html>
